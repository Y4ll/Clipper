name: Build Clipper.exe

on:
  workflow_dispatch:
  push:
    paths:
      - clipper_app.py
      - icon.ico
      - installer.iss
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crear Clipper.exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --noconsole --icon icon.ico --name Clipper clipper_app.py

      - name: Descargar ffmpeg.exe y armar el zip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Path pack | Out-Null
          Copy-Item dist\Clipper.exe pack\
          Copy-Item $ff.FullName pack\
          Compress-Archive -Path pack\* -DestinationPath Clipper-Windows.zip

      - name: Crear instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path output\ClipperSetup.exe)) { throw "No se creó ClipperSetup.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: Clipper-Windows
          path: |
            Clipper-Windows.zip
            output/ClipperSetup.exe

      - name: Publicar Release (instalador y zip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y --repo ${{ github.repository }}
          $global:LASTEXITCODE = 0
          gh release create latest output/ClipperSetup.exe Clipper-Windows.zip --repo ${{ github.repository }} --target ${{ github.sha }} --title "Clipper para Windows" --notes "Descarga ClipperSetup.exe para instalar Clipper con acceso directo y desinstalador. Clipper-Windows.zip es la versión portátil (descomprime y abre Clipper.exe). Las dos traen ffmpeg.exe."
