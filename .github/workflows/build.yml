name: Build Clipper.exe

on:
  workflow_dispatch:
  push:
    paths:
      - clipper_app.py
      - ui.html
      - icon.ico
      - installer.iss
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crear Clipper.exe
        shell: pwsh
        run: |
          python -m pip install pyinstaller pywebview yt-dlp
          "${{ github.sha }}".Substring(0,7) | Out-File -Encoding ascii -NoNewline build.txt
          python -m PyInstaller --onefile --noconsole --icon icon.ico --add-data "icon.ico;." --add-data "ui.html;." --add-data "build.txt;." --collect-all yt_dlp --collect-all webview --collect-all clr_loader --collect-all pythonnet --name Clipper clipper_app.py

      - name: Descargar ffmpeg.exe y armar el zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Path pack | Out-Null
          Copy-Item dist\Clipper.exe pack\
          Copy-Item $ff.FullName pack\
          New-Item -ItemType Directory -Path pack\whisper -Force | Out-Null
          function Get-Retry($uri, $out) {
            for ($i = 1; $i -le 4; $i++) {
              try { Invoke-WebRequest -Uri $uri -OutFile $out -TimeoutSec 600; return } catch { Write-Host "intento $i fallo: $_"; Start-Sleep -Seconds (5 * $i) }
            }
            throw "no se pudo descargar $uri"
          }
          try {
            $rels = gh api "repos/ggml-org/whisper.cpp/releases?per_page=8" | ConvertFrom-Json
            $asset = $null
            foreach ($r in $rels) {
              Write-Host ("release " + $r.tag_name + ": " + (($r.assets | ForEach-Object { $_.name }) -join ", "))
              if (-not $asset) {
                $asset = $r.assets | Where-Object { $_.name -match "x64" -and $_.name -match "bin" -and $_.name -notmatch "cublas|blas|cuda|vulkan" -and $_.name -match "\.zip$" } | Select-Object -First 1
              }
            }
            if (-not $asset) { throw "no hay whisper-bin-x64.zip" }
            Get-Retry $asset.browser_download_url whisper.zip
            Expand-Archive whisper.zip -DestinationPath whisper_tmp
            $cli = Get-ChildItem -Path whisper_tmp -Recurse -Filter whisper-cli.exe | Select-Object -First 1
            if (-not $cli) { throw "no hay whisper-cli.exe" }
            Copy-Item "$($cli.DirectoryName)\*" pack\whisper\ -Recurse
            Get-Retry "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin" "pack\whisper\ggml-base-q5_1.bin"
            if ((Get-Item pack\whisper\ggml-base-q5_1.bin).Length -lt 10000000) { throw "modelo incompleto" }
          } catch {
            Write-Host "ERROR whisper: $_"
            Remove-Item pack\whisper\* -Recurse -Force -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path pack\whisper\whisper-cli.exe) -or -not (Test-Path pack\whisper\ggml-base-q5_1.bin)) {
            throw "Falta Whisper (whisper-cli.exe o el modelo): el build se detiene para no publicar una version sin subtitulos"
          }
          Compress-Archive -Path pack\* -DestinationPath Clipper-Windows.zip

      - name: Crear instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path output\ClipperSetup.exe)) { throw "No se creó ClipperSetup.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: Clipper-Windows
          path: |
            Clipper-Windows.zip
            output/ClipperSetup.exe

      - name: Publicar Release (instalador y zip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y --repo ${{ github.repository }}
          $global:LASTEXITCODE = 0
          gh release create latest output/ClipperSetup.exe pack/Clipper.exe Clipper-Windows.zip --repo ${{ github.repository }} --target ${{ github.sha }} --title "Clipper para Windows" --notes "Descarga ClipperSetup.exe para instalar Clipper con acceso directo y desinstalador. Clipper-Windows.zip es la versión portátil (descomprime y abre Clipper.exe). Las dos traen ffmpeg.exe."
